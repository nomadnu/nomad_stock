services:
  # 매매 봇 (지침서 반자동: 12:50 승인 스캔 + 손절/방어선 + 금요일 재평가 + 텔레그램 명령)
  bot:
    build: .
    container_name: nomad_stock_bot
    restart: unless-stopped          # 죽으면 자동 재시작 (24h 운영)
    env_file: .env                   # KIS 키/텔레그램 토큰 주입 (이미지에 안 굽는다)
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./logs:/app/logs             # 봇 로그 영속화
      - ./.tokens:/app/.tokens       # 토큰 캐시(대시보드와 공유 → KIS 충돌 방지)
      - ./data_cache:/app/data_cache
      - ./watchlist.json:/app/watchlist.json
      - ./state:/app/state           # 미국 페이퍼 장부(대시보드와 공유)
    command: python run_bot.py

  # 웹 대시보드 (외부 접속용). DASHBOARD_PASSWORD 설정 필수.
  dashboard:
    build: .
    container_name: nomad_stock_dashboard
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Asia/Seoul
    ports:
      - "5000:5000"                  # 외부:컨테이너
    volumes:
      - ./logs:/app/logs             # 매매 로그를 대시보드에서 읽기 위해 공유
      - ./.tokens:/app/.tokens
      - ./data_cache:/app/data_cache
      - ./watchlist.json:/app/watchlist.json
      - ./state:/app/state           # 미국 페이퍼 장부(봇과 공유, 읽기)
    command: python run_dashboard.py --prod
